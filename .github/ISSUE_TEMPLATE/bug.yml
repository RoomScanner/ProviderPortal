name: Bug
description: Something is broken
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Fix verified with the steps above
        - [ ] Regression test or manual check recorded
        - [ ] Reviewed by the assigned reviewer, every comment answered
        - [ ] Merged and checked in staging
        - [ ] Included in the Docker deployment (Milestone 2 only)
