name: branch-name

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix|docs|chore|refactor|test|ci)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$BRANCH' doesn't follow the naming convention. Use <type>/<issue-number>-short-name, e.g. feat/12-provider-registration (types: feat, fix, docs, chore, refactor, test, ci). Rename it with: git branch -m <new-name> && git push origin -u <new-name>, then open a new PR."
            exit 1
          fi
          echo "Branch name OK: $BRANCH"
